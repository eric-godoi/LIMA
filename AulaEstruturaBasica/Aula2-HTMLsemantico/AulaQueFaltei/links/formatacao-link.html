<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Links</title>
    <style>
        body{
            background-color: black;
        }
        h1{
            color: hotpink
        }
        a:link {
            color: blue;
            text-decoration: none;
        }
        a:visited {
            color: yellow;
        }
        a:hover {
            color: red;
            text-decoration: underline;
            font-size: 17px;
        }
        a:active {
            color: orange;
        }
    </style>
</head>
<body>
    <h1>Formatação de Links com CSS</h1>
    <p><a href="#">Formatação de Links</a></p>
</body>
</html>
