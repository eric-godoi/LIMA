<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <style>
        div {
            text-align: center;
            background-color: #558ac7;
        }
    </style>
</head>
<body>
    <section>
            <div>
                <h2>Formulário</h2><hr>
                <form action="cadastro.php" method="post">
                <label>Nome</label><br>
                <input type="text" name="nome" placeholder="Digite seu nome" required><br><br>
                <label>Senha</label><br>
                <input type="password" name="senha"  required minlength="8" placeholder="Digite sua senha"><br><br>
                <label>Email</label><br>
                <input type="email" name="email" placeholder="Digite seu email" required><br><br>
                <label>Telefone</label><br>
                <input type="tel" name="telefone" placeholder="(00) 0000-0000" required><br><br>
                <label>CEP</label><br>
                <input type="text" name="cep" placeholder="00000-000" required><br><br>
                <label>Sobre você</label><br>
                <textarea name="bio" rows="10" cols="70" placeholder="Conte-nos sobre você"></textarea><br><br>
                <label>Sexo</label><br>
                <input type="radio" name="sexo" value="M">Masculino
                <input type="radio" name="sexo" value="F">Feminino<br><br>
                <label>Interesses</label><br>
                <input type="checkbox" name="interesses" value="Esportes">Esportes<br>
                <input type="checkbox" name="interesses" value="artes">Artes<br>
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia<br><br>
                <label>País</label><br>
                <select name="pais" required>
                    <option value=""></option>
                    <option value="brasil">Brasil</option>
                    <option value="argentina">Argentina</option>
                    <option value="chile">Chile</option>
                </select><br><br>
                <label>Foto de perfil</label><br>
                <input type="file" name="foto"><br><br>
                <button type="submit" value="Enviar">Enviar</button>
            </div>
        </form>
    </section>
    
</body>
</html>
